name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} python -m unittest discover -s tests -t . -v

      - name: Smoke-test the CLI
        run: |
          uv run --python ${{ matrix.python-version }} python -m extscan --version
          uv run --python ${{ matrix.python-version }} python -m extscan probes
          uv run --python ${{ matrix.python-version }} python -m extscan providers
          uv run --python ${{ matrix.python-version }} python -m extscan doctor || true
