[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extscan"
version = "0.2.0"
description = "Orchestrated external attack-surface scanning for authorised security assessments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.69"]
bedrock = ["anthropic[bedrock]>=0.69"]
all = ["anthropic[bedrock]>=0.69"]

[project.scripts]
extscan = "extscan.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["extscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["extscan", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "TID",
    "PTH",
    "RUF",
    "S",
]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "RET504",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "S104",
    "S105",
    "S106",
    "S311",
]
"tests/targetapp.py" = ["S104", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["extscan"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
